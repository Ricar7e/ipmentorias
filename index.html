<style>
  :root {
    --bg: #0A0908;
    --bg-elev: #121110;
    --bg-card: #161513;
    --bg-card-hover: #1B1A17;
    --border: #2A2823;
    --border-strong: #3A3732;
    --text: #F2EEE6;
    --text-dim: #B5AFA4;
    --text-mute: #7A746A;
    --accent: #D4A574;
    --accent-soft: rgba(212, 165, 116, 0.12);
    --accent-glow: rgba(212, 165, 116, 0.18);
    --radius: 14px;
    --radius-lg: 22px;
    --maxw: 1180px;
    --pad-section: 120px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Montserrat", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--accent); color: #0A0908; }

  .container { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }

  /* ===== NAV ===== */
  .nav {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 50;
    backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%);
    background: rgba(16, 14, 12, 0.55);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    transition: background .3s, border-color .3s, box-shadow .3s;
    box-shadow: 0 4px 30px rgba(0,0,0,0.25);
  }
  .nav.scrolled {
    background: rgba(16, 14, 12, 0.85);
    border-color: rgba(255,255,255,0.12);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .nav .container { max-width: none; padding: 0; }
  .nav-inner { display: flex; align-items: center; gap: 24px; height: 52px; padding: 0 6px 0 22px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: -0.01em; padding-right: 14px; border-right: 1px solid rgba(255,255,255,0.1); }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #B88858);
    display: grid; place-items: center;
    font-family: "Montserrat"; font-style: italic; color: #0A0908; font-size: 14px; line-height: 1; font-weight: 700;
  }
  .brand-name { font-size: 14px; }
  .brand-name em { font-family: "Montserrat"; font-style: italic; color: var(--accent); font-weight: 500; }
  .nav-links { display: flex; gap: 22px; align-items: center; }
  .nav-links a { font-size: 13px; color: var(--text-dim); transition: color .15s; font-weight: 500; }
  .nav-links a:hover { color: var(--text); }
  .nav-cta {
    background: var(--text); color: var(--bg); border: none;
    padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
    transition: transform .15s, background .15s;
  }
  .nav-cta:hover { background: var(--accent); transform: translateY(-1px); }
  @media (max-width: 760px) {
    .nav { top: 12px; }
    .nav-links { display: none; }
    .brand { border-right: none; padding-right: 0; }
    .nav-inner { gap: 12px; }
  }

  /* ===== HERO ===== */
  .hero {
    position: relative; padding: 110px 0 60px;
    height: 100vh; min-height: 640px;
    overflow: hidden;
    background-color: #000;
    background-image: url("assets/logo.webp");
    background-repeat: no-repeat;
    background-position: right center;
    background-size: contain;
    display: flex; align-items: center;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.92) 30%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0) 70%);
    pointer-events: none;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,9,8,0.4) 0%, transparent 20%, transparent 75%, rgba(10,9,8,0.7) 100%);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; width: 100%; text-align: left; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px 6px 8px;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 999px;
    background: rgba(255,255,255,0.04);
    font-size: 12px; color: var(--text-dim);
    margin-bottom: 24px;
    font-weight: 500;
  }
  .hero-eyebrow .dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 10px;
  }
  .hero-eyebrow strong { color: var(--text); font-weight: 600; }
  .hero h1 {
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    font-size: clamp(32px, 4.4vw, 58px);
    line-height: 1.06; letter-spacing: -0.025em;
    margin: 0 0 22px; max-width: 680px;
    text-wrap: balance;
    color: #fff;
  }
  .hero h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .hero h1 strong { font-weight: 600; color: #fff; }
  .hero-sub {
    font-size: clamp(14px, 1.1vw, 17px);
    color: var(--text-dim); line-height: 1.5;
    max-width: 540px; margin: 0 0 32px;
    text-wrap: pretty;
    font-weight: 400;
  }
  .hero-ctas { display: inline-flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--text); color: var(--bg);
    border: none; padding: 14px 22px; border-radius: 999px;
    font-size: 14.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .15s, box-shadow .2s, background .15s;
    box-shadow: 0 4px 18px rgba(212, 165, 116, 0.1);
  }
  .btn-primary:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 32px var(--accent-glow); }
  .btn-ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--border-strong); padding: 13px 20px; border-radius: 999px;
    font-size: 14.5px; font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  .btn-ghost:hover { border-color: var(--accent); background: var(--accent-soft); }

  .hero-meta {
    display: flex; gap: 36px; align-items: center; flex-wrap: nowrap;
    margin-top: 44px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,0.1);
    max-width: 760px;
  }
  .hero-meta-item {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 9.5px; color: var(--text-dim);
    letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;
    white-space: nowrap;
  }
  .hero-meta-item strong {
    font-weight: 500; font-size: 30px; color: var(--accent); letter-spacing: -0.02em;
    text-transform: none;
  }

  @media (max-width: 1100px) {
    .hero { background-size: auto 100%; background-position: 90% center; }
    .hero::before { background: linear-gradient(90deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0.92) 40%, rgba(0,0,0,0.55) 65%, rgba(0,0,0,0) 95%); }
  }
  @media (max-width: 760px) {
    .hero { background-size: 140% auto; background-position: 60% bottom; padding-bottom: 50vh; height: auto; min-height: auto; padding-top: 96px; }
    .hero::before { background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0.4) 65%, rgba(0,0,0,0) 100%); }
    .hero h1 { font-size: clamp(28px, 7vw, 40px); }
    .hero-meta { gap: 20px; margin-top: 32px; padding-top: 24px; }
    .hero-meta-item strong { font-size: 22px; }
  }

  /* ===== Section base ===== */
  section.s {
    padding-top: var(--pad-section);
    padding-bottom: var(--pad-section);
    position: relative;
  }
  .s-eyebrow {
    font-family: "Montserrat", sans-serif;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 18px;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .s-eyebrow::before {
    content: ""; width: 22px; height: 1px; background: var(--accent);
  }
  .s-title {
    font-family: "Montserrat"; font-weight: 300;
    font-size: clamp(30px, 3.6vw, 48px); line-height: 1.08; letter-spacing: -0.025em;
    margin: 0 0 18px; max-width: 820px;
    text-wrap: balance;
  }
  .s-title em { font-style: italic; color: var(--accent); font-weight: 400; }
  .s-title strong { font-weight: 600; }
  .s-sub { color: var(--text-dim); font-size: 17px; line-height: 1.55; max-width: 640px; text-wrap: pretty; }
  .s-head { margin-bottom: 56px; }

  /* ===== Pain points ===== */
  .pain-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
  }
  .pain-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 26px; min-height: 180px;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: border-color .2s, background .2s, transform .2s;
    position: relative; overflow: hidden;
  }
  .pain-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); transform: translateY(-2px); }
  .pain-num {
    font-family: "Montserrat", sans-serif; font-size: 11px;
    color: var(--text-mute); letter-spacing: 0.05em;
  }
  .pain-body {
    font-size: 17px; line-height: 1.4; color: var(--text);
    margin: 0; letter-spacing: -0.005em;
  }
  .pain-card .accent-tick {
    color: var(--accent); font-size: 14px;
  }
  @media (max-width: 900px) { .pain-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .pain-grid { grid-template-columns: 1fr; } }

  /* ===== Audience ===== */
  .aud-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .aud-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px;
    transition: border-color .2s, background .2s;
  }
  .aud-card:hover { border-color: var(--border-strong); background: var(--bg-card-hover); }
  .aud-card .who {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
    font-size: 13px; font-weight: 500; color: var(--accent);
    font-family: "Montserrat", sans-serif; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .aud-card .who-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent-soft); display: grid; place-items: center;
    color: var(--accent); font-family: "Montserrat"; font-style: italic; font-size: 16px;
  }
  .aud-card p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--text-dim); }
  .aud-card p strong { color: var(--text); font-weight: 500; }
  @media (max-width: 760px) { .aud-grid { grid-template-columns: 1fr; } }

  /* ===== Not for you ===== */
  .nfy {
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 48px; background: var(--bg-elev);
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 48px; align-items: start;
  }
  .nfy h3 {
    font-family: "Montserrat"; font-weight: 400; font-size: 36px;
    margin: 0; letter-spacing: -0.02em; line-height: 1.05;
  }
  .nfy ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }
  .nfy li {
    display: flex; gap: 14px; align-items: flex-start;
    font-size: 16px; line-height: 1.5; color: var(--text-dim);
    padding-bottom: 16px; border-bottom: 1px solid var(--border);
  }
  .nfy li:last-child { border-bottom: none; padding-bottom: 0; }
  .nfy li .x {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--border-strong); display: grid; place-items: center;
    color: var(--text-mute); font-size: 11px; margin-top: 2px;
  }
  @media (max-width: 760px) { .nfy { grid-template-columns: 1fr; padding: 32px; gap: 24px; } }

  /* ===== Mentorias (3 programs) ===== */
  .mentorias-wrap {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  .mentoria {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 32px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
    transition: border-color .25s, transform .25s;
    cursor: pointer;
  }
  .mentoria:hover { border-color: var(--accent); transform: translateY(-3px); }
  .mentoria.active { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft) 0%, var(--bg-card) 100%); }
  .mentoria-stage {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: "Montserrat", sans-serif; font-size: 11px;
    color: var(--text-mute); letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 24px;
  }
  .mentoria-stage .pill {
    padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
  }
  .mentoria h3 {
    font-family: "Montserrat"; font-weight: 400; font-size: 32px;
    margin: 0 0 14px; letter-spacing: -0.02em; line-height: 1.05;
  }
  .mentoria h3 em { font-style: italic; color: var(--accent); }
  .mentoria p { margin: 0 0 28px; font-size: 15px; line-height: 1.55; color: var(--text-dim); flex-grow: 1; }
  .mentoria-tag {
    font-family: "Montserrat", sans-serif; font-size: 11px;
    color: var(--accent); display: inline-flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--border); padding-top: 18px;
  }
  .mentoria-tag::after { content: "→"; transition: transform .2s; }
  .mentoria:hover .mentoria-tag::after { transform: translateX(4px); }
  @media (max-width: 900px) { .mentorias-wrap { grid-template-columns: 1fr; } }

  /* ===== Método timeline ===== */
  .metodo-wrap {
    margin-top: 40px;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 48px;
    overflow: hidden;
  }
  .metodo-note {
    font-family: "Montserrat", sans-serif; font-size: 11.5px;
    color: var(--text-mute); margin-bottom: 32px;
    display: flex; gap: 24px; flex-wrap: wrap;
  }
  .metodo-note span { display: flex; align-items: center; gap: 8px; }
  .metodo-note span::before { content: "✕"; color: var(--text-mute); }
  .metodo-flow {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    position: relative;
  }
  .metodo-step {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 24px 18px;
    min-height: 170px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
    transition: background .2s, border-color .2s, transform .2s;
  }
  .metodo-step:hover { background: var(--bg-card-hover); border-color: var(--accent); transform: translateY(-2px); }
  .metodo-step .ms-num {
    font-family: "Montserrat", sans-serif; font-size: 12px;
    color: var(--accent); letter-spacing: 0.1em; font-weight: 600;
    text-transform: uppercase;
  }
  .metodo-step .ms-label {
    font-size: 17px; line-height: 1.25; color: var(--text);
    letter-spacing: -0.01em; font-weight: 500;
  }
  .metodo-conclusion {
    margin-top: 32px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .metodo-conclusion div {
    color: var(--text-dim); padding: 22px 26px;
    background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid var(--border);
    font-family: "Montserrat", sans-serif; font-style: italic; font-size: 22px; font-weight: 300;
    letter-spacing: -0.01em; line-height: 1.35;
  }
  @media (max-width: 1000px) {
    .metodo-flow { grid-template-columns: repeat(2, 1fr); }
    .metodo-conclusion { grid-template-columns: 1fr; }
  }

  /* ===== Carolina bio ===== */
  .bio {
    display: grid; grid-template-columns: 380px 1fr; gap: 56px; align-items: stretch;
  }
  .bio-portrait {
    border-radius: var(--radius-lg);
    background-image: url("assets/photo.webp");
    background-size: cover;
    background-position: center 18%;
    background-color: #1A1815;
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    min-height: 480px;
  }
  .bio-portrait::after {

  .testi-thumb {

    transition: transform .5s cubic-bezier(.22,.61,.36,1), opacity .4s, filter .4s;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.5);
  }
  .testi-thumb-prev {
    transform: translateX(-12%) rotate(-3deg) scale(0.86);
    opacity: 0.35; filter: brightness(0.55);

  }
  .testi-thumb-next {
    transform: translateX(12%) rotate(3deg) scale(0.86);
    opacity: 0.35; filter: brightness(0.55);
    z-index: 1; cursor: pointer;
  }
  .testi-thumb-prev:hover, .testi-thumb-next:hover { opacity: 0.55; filter: brightness(0.75); }
  .testi-thumb-main {
    z-index: 2; cursor: pointer;

    animation: testi-in 0.55s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes testi-in {
    from { opacity: 0; transform: translateX(20px) scale(0.94); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes testi-text-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .testi-content-inner {
    animation: testi-text-in 0.45s cubic-bezier(.22,.61,.36,1);
  }
  .testi-thumb-main::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.4) 100%);
    pointer-events: none;
  }
  .testi-play {
    position: relative; z-index: 1;
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--accent); color: #0A0908;
    border: none; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 0 0 0 rgba(212,165,116,0.5), 0 10px 30px rgba(0,0,0,0.4);
    transition: transform .2s, box-shadow .3s;
  }
  .testi-thumb-main:hover .testi-play {
    transform: scale(1.08);
    box-shadow: 0 0 0 12px rgba(212,165,116,0.15), 0 10px 30px rgba(0,0,0,0.5);
  }
  .testi-play svg { margin-left: 3px; }

  .testi-content { padding-left: 8px; }
  .testi-name {
    font-family: "Montserrat", sans-serif;
    font-size: clamp(22px, 2.1vw, 30px);
    font-weight: 500; letter-spacing: -0.02em; line-height: 1.15;
    margin: 0 0 10px; color: #fff;
    text-wrap: balance;
  }
  .testi-role {
    font-family: "Montserrat", sans-serif; font-size: 11px;
    color: var(--text-dim); letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 600; margin-bottom: 28px;
  }
  .testi-quote {
    font-family: "Montserrat", sans-serif;
    font-style: italic; font-weight: 300;
    font-size: clamp(18px, 1.6vw, 22px);
    line-height: 1.45; letter-spacing: -0.005em;
    color: var(--text); margin: 0 0 36px;
    text-wrap: pretty;
  }
  .testi-cta {
    display: inline-flex; align-items: center; justify-content: space-between; gap: 18px;
    background: var(--accent); color: #0A0908;
    border: none; padding: 16px 28px;
    border-radius: 999px;
    font-size: 15.5px; font-weight: 600; letter-spacing: -0.005em;
    cursor: pointer;
    white-space: nowrap;
    min-width: 280px;
    transition: transform .15s, box-shadow .2s, background .15s, filter .15s;
    box-shadow: 0 10px 32px rgba(212, 165, 116, 0.22);
  }
  .testi-cta:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 16px 40px rgba(212, 165, 116, 0.35); }
  .testi-cta span {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 17px; color: #0A0908;
    transition: transform .2s;
  }
  .testi-cta:hover span { transform: translateX(4px); }

  .testi-nav {
    display: flex; align-items: center; gap: 18px;
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .testi-nav .testi-arrow {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-strong);
    background: transparent; color: var(--text-dim);

    transition: border-color .15s, color .15s, background .15s;

  .testi-nav .testi-arrow:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .testi-counter {
    display: flex; align-items: center; gap: 12px;
    font-family: "Montserrat", sans-serif; font-size: 13px;
    color: var(--text-dim); font-weight: 500; letter-spacing: 0.05em;
    margin-left: 6px;
  }
  .testi-counter .cur { color: var(--text); font-size: 15px; font-weight: 600; }
  .testi-counter .sep { opacity: 0.4; }
  .testi-playlist {
    margin-left: auto;
    font-size: 12px; color: var(--text-dim); font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    transition: color .15s;
  }
  .testi-playlist:hover { color: var(--accent); }

  @media (max-width: 900px) {
    .testi-stage { grid-template-columns: 1fr; gap: 48px; }
    .testi-content { padding-left: 0; }
  }

  /* ===== Video modal ===== */
  .video-back {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
    display: grid; place-items: center; padding: 32px;
    animation: vfade .2s ease;
  }
  @keyframes vfade { from { opacity: 0; } to { opacity: 1; } }
  .video-frame {
    position: relative; width: 100%; max-width: 1100px;
    aspect-ratio: 16/9;

  .video-close {
    position: absolute; top: -50px; right: 0;

    display: grid; place-items: center;
    transition: background .15s;
  }
  .video-close:hover { background: rgba(255,255,255,0.18); }

  /* ===== Final CTA ===== */
  .final-cta {
    position: relative; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 80px 56px;
    background: var(--bg-elev);

  }
  .final-cta::before {
    content: ""; position: absolute; top: -200px; left: 50%; transform: translateX(-50%);

  }
  .final-cta-inner { position: relative; z-index: 1; }
  .final-cta h2 {
    font-family: "Montserrat"; font-weight: 400;
    font-size: clamp(36px, 5vw, 64px); line-height: 1.05; letter-spacing: -0.02em;
    margin: 0 0 24px; max-width: 760px; margin-left: auto; margin-right: auto;
    text-wrap: balance;
  }
  .final-cta h2 em { font-style: italic; color: var(--accent); }
  .final-cta p { color: var(--text-dim); font-size: 17px; line-height: 1.5; max-width: 560px; margin: 0 auto 40px; text-wrap: pretty; }
  .final-cta-notes {
    margin-top: 36px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
    font-family: "Montserrat", sans-serif; font-size: 11.5px; color: var(--text-mute);
    letter-spacing: 0.04em;
  }
  .final-cta-notes span { display: flex; align-items: center; gap: 8px; }
  .final-cta-notes span::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
  }

  /* ===== Footer ===== */
  footer {
    padding: 80px 0 48px;
    border-top: 1px solid var(--border); margin-top: 80px;
  }
  .foot-inner {
    display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 48px;
  }
  .foot-col h5 {
    font-family: "Montserrat", sans-serif; font-size: 11px;
    color: var(--text-mute); letter-spacing: 0.1em; text-transform: uppercase;
    margin: 0 0 16px;
  }
  .foot-col a { display: block; padding: 6px 0; color: var(--text-dim); font-size: 14px; transition: color .15s; }
  .foot-col a:hover { color: var(--accent); }
  .foot-tag {
    color: var(--text-dim); font-size: 14px; line-height: 1.5; margin-top: 16px; max-width: 280px;
  }
  .foot-bottom {
    margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-family: "Montserrat", sans-serif; font-size: 11px; color: var(--text-mute);
    letter-spacing: 0.04em;
  }
  @media (max-width: 800px) { .foot-inner { grid-template-columns: 1fr 1fr; } }

  /* ===== Modal form ===== */
  .modal-back {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5, 4, 3, 0.7); backdrop-filter: blur(10px);
    display: grid; place-items: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-back.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius-lg); width: 100%; max-width: 540px;
    padding: 40px; max-height: 90vh; overflow-y: auto;
    transform: translateY(20px); transition: transform .25s;
  }
  .modal-back.open .modal { transform: translateY(0); }
  .modal h3 {
    font-family: "Montserrat"; font-weight: 400; font-size: 32px;
    letter-spacing: -0.02em; margin: 0 0 8px;
  }
  .modal-sub { color: var(--text-dim); font-size: 14.5px; margin: 0 0 28px; }
  .modal-step-dots { display: flex; gap: 6px; margin-bottom: 28px; }
  .modal-step-dots div {
    flex: 1; height: 3px; border-radius: 2px;
    background: var(--border);
    transition: background .25s;
  }
  .modal-step-dots div.active { background: var(--accent); }
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-family: "Montserrat", sans-serif; font-size: 11px;
    color: var(--text-mute); letter-spacing: 0.05em; text-transform: uppercase;
    margin-bottom: 8px;
  }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 10px;
    font-family: inherit; font-size: 15px; outline: none;
    transition: border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field-options button {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); padding: 14px 12px; border-radius: 10px;
    font-size: 13.5px; text-align: left;
    transition: border-color .15s, background .15s;
  }
  .field-options button:hover { border-color: var(--border-strong); }
  .field-options button.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .modal-actions { display: flex; justify-content: space-between; margin-top: 28px; gap: 10px; }
  .modal-success {
    text-align: center; padding: 24px 0;
  }
  .modal-success .check {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; margin: 0 auto 20px;
    font-size: 28px;
    border: 1px solid var(--accent);
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    display: grid; place-items: center; font-size: 14px;
  }
  .modal { position: relative; }

  /* small */
  .divider-dot { color: var(--text-mute); margin: 0 8px; }
</style>
